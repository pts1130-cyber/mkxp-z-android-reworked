name: Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REF: 061405b5931a0c97313b951042343a028f3000e5

jobs:
  build-windows:
    name: Windows MSYS2 (x86_64, legacy layout)
    runs-on: windows-latest
    steps:
      - name: Checkout patch repository
        uses: actions/checkout@v4
        with:
          path: patchrepo

      - name: Checkout upstream mkxp-z
        uses: actions/checkout@v4
        with:
          repository: mkxp-z/mkxp-z
          ref: ${{ env.UPSTREAM_REF }}
          path: mkxp-z

      - name: Apply Audio.se_preload patch
        shell: bash
        run: |
          cd mkxp-z
          git apply --check ../patchrepo/windows-engine/se-preload.patch
          git apply ../patchrepo/windows-engine/se-preload.patch
          git diff --stat

      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          suppress-deprecation-warnings: msystem-mingw64
          install: >-
            base-devel
            git
            ruby
            vim
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-gcc

      - name: Build all dependencies
        shell: msys2 {0}
        run: |
          cd mkxp-z/windows
          make

      - name: Build exe
        shell: msys2 {0}
        run: |
          cd mkxp-z
          source windows/vars.sh
          meson setup build
          cd build
          ninja
          strip ./mkxp-z.exe

      - name: Prepare archive
        shell: msys2 {0}
        run: |
          cd mkxp-z
          mkdir build/artifact
          cd build/artifact
          cp /mingw64/bin/zlib1.dll .
          cp ../../windows/build-mingw64/bin/x64-msvcrt-ruby310.dll .
          cp -r ../../windows/build-mingw64/lib/ruby/3.1.0 .
          mv ./3.1.0 ./stdlib
          cp ../mkxp-z.exe .
          cp ../../mkxp.json .
          cp -r ../../scripts .
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mkxp-z-windows-legacy-se-preload
          path: mkxp-z/build/artifact/
          if-no-files-found: error
